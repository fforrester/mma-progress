<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MMA Progress">

  <title>MMA Progress</title>

  <!-- Installable web-app settings -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- All visual styling lives here -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>

    <!-- 1. APP HEADER -->
    <header>
      <h1>MMA Progress</h1>
      <p class="muted">Sessions + hours. Nothing else.</p>
    </header>

    <!-- 2. SUMMARY -->
    <section class="grid stats">
      <div class="card wide">
        <div class="muted" id="periodLabel">All time</div>
        <div class="value" id="totalSessions"></div>
        <div class="muted" id="periodRange"></div>
      </div>

      <div class="card">
        <div class="muted">Training time</div>
        <div class="value" id="totalTime"></div>
      </div>

      <div class="card">
        <div class="muted">Average session</div>
        <div class="value" id="avgSession"></div>
      </div>
    </section>

    <!-- 3. PERIOD FILTER -->
    <section class="card section">
      <h2>View progress</h2>

      <div class="tabs">
        <button data-view="week">Week</button>
        <button data-view="month">Month</button>
        <button data-view="year">Year</button>
        <button data-view="all" class="active">All time</button>
      </div>

      <div id="anchorWrap" class="section hidden">
        <label for="anchorDate">Choose a date in that period</label>
        <input id="anchorDate" type="date">
      </div>
    </section>

    <!-- 4. ADD A SESSION -->
    <section class="card section">
      <h2>Add session</h2>

      <form id="addForm">
        <div class="form">
          <div>
            <label for="sessionDate">Date</label>
            <input id="sessionDate" type="date" required>
          </div>

          <div>
            <label for="discipline">Type</label>
            <select id="discipline">
              <option>Boxing</option>
              <option>MMA</option>
              <option>BJJ / Grappling</option>
              <option>Wrestling</option>
              <option>1-to-1</option>
            </select>
          </div>
        </div>

        <div class="section">
          <label>Duration</label>
          <div class="durations">
            <button type="button" data-minutes="45">45m</button>
            <button type="button" data-minutes="60" class="active">60m</button>
            <button type="button" data-minutes="90">90m</button>
            <button type="button" data-minutes="120">120m</button>
          </div>
        </div>

        <div class="section">
          <button class="primary" type="submit">Add session</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </form>
    </section>

    <!-- 5. DISCIPLINE BREAKDOWN -->
    <section class="card section">
      <h2>Breakdown</h2>
      <div id="breakdown"></div>
    </section>

    <!-- 6. SESSION HISTORY -->
    <section class="card section">
      <h2>History</h2>
      <div id="history" class="history"></div>
    </section>

    <!-- 7. BACKUP / RESTORE -->
    <section class="card section">
      <h2>Backup</h2>

      <p class="muted backup-copy">
        Your data is saved on this device. Export a backup to OneDrive or another cloud drive occasionally.
      </p>

      <div class="toolbar">
        <button id="exportBtn" type="button">Export backup</button>
        <button id="restoreBtn" type="button">Restore backup</button>
      </div>

      <!-- Hidden file picker used by the Restore button -->
      <input id="restoreFile" class="hidden" type="file" accept="application/json,.json">

      <div id="backupStatus" class="status" aria-live="polite"></div>

      <div class="section">
        <button id="resetBtn" type="button">Clear all data</button>
      </div>
    </section>

  </main>

  <!-- Data storage and backup functions -->
  <script src="storage.js"></script>

  <!-- Main app behaviour and screen updates -->
  <script src="app.js"></script>
</body>
</html>
